x-tapflow-env: &tapflow-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-3366}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://tapflow-redis:6379}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-aigc-flow:staging}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
  NODE_EXECUTE_CONCURRENCY: ${NODE_EXECUTE_CONCURRENCY:-16}
  PROVIDER_POLL_CONCURRENCY: ${PROVIDER_POLL_CONCURRENCY:-16}
  CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
  CREDENTIAL_KEY_VERSION: ${CREDENTIAL_KEY_VERSION:-v1}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-1000}
  API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
  AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  tapflow-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - tapflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  tapflow-api:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:api"]
    depends_on:
      tapflow-redis:
        condition: service_healthy
    environment:
      <<: *tapflow-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3366}:3366"

  tapflow-worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    depends_on:
      tapflow-redis:
        condition: service_healthy
    environment:
      <<: *tapflow-env

  tapflow-frontend:
    build: .
    restart: unless-stopped
    command: ["node", "scripts/serve-dist.cjs", "5188"]
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 5188
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5188}:5188"

volumes:
  tapflow-redis-data:
