x-tapflow-env: &tapflow-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-3366}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://tapflow-redis:6379}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-aigc-flow:staging}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
  ASSET_IMAGE_VARIANT_CONCURRENCY: ${ASSET_IMAGE_VARIANT_CONCURRENCY:-2}
  WORKER_IMAGE_VARIANTS_MODE: ${WORKER_IMAGE_VARIANTS_MODE:-sync}
  NODE_EXECUTE_CONCURRENCY: ${NODE_EXECUTE_CONCURRENCY:-16}
  PROVIDER_POLL_CONCURRENCY: ${PROVIDER_POLL_CONCURRENCY:-16}
  CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
  CREDENTIAL_KEY_VERSION: ${CREDENTIAL_KEY_VERSION:-v1}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-art@art.aittco.com}
  RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Art-Aittco}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  PROMPT_CATALOG_MEDIA_DIR: /var/lib/tapflow/prompt-catalog
  API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-1000}
  API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
  AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  AGENT_PLANNER_ENABLED: ${AGENT_PLANNER_ENABLED:-false}
  AGENT_DIRECTOR_ENABLED: ${AGENT_DIRECTOR_ENABLED:-false}
  AGENT_TEXT_ROUTE_KEY: ${AGENT_TEXT_ROUTE_KEY:-text.default}
  AGENT_EXECUTOR_ENABLED: ${AGENT_EXECUTOR_ENABLED:-false}
  AGENT_EXECUTOR_REQUIRE_APPROVAL: ${AGENT_EXECUTOR_REQUIRE_APPROVAL:-true}
  AGENT_EXECUTOR_MAX_TOOL_ROUNDS: ${AGENT_EXECUTOR_MAX_TOOL_ROUNDS:-8}
  AGENT_EXECUTOR_MAX_GENERATED_ITEMS: ${AGENT_EXECUTOR_MAX_GENERATED_ITEMS:-8}
  AGENT_EXECUTOR_MAX_ESTIMATED_CREDITS: ${AGENT_EXECUTOR_MAX_ESTIMATED_CREDITS:-50}
  AGENT_EXECUTOR_TURN_TIMEOUT_MS: ${AGENT_EXECUTOR_TURN_TIMEOUT_MS:-300000}
  AGENT_EXECUTOR_TOOL_TIMEOUT_MS: ${AGENT_EXECUTOR_TOOL_TIMEOUT_MS:-180000}
  AGENT_EXECUTOR_ALLOW_BATCH_IMAGE: ${AGENT_EXECUTOR_ALLOW_BATCH_IMAGE:-true}
  AGENT_EXECUTOR_ALLOW_IMAGE_EDIT: ${AGENT_EXECUTOR_ALLOW_IMAGE_EDIT:-false}
  AGENT_EXECUTOR_ALLOW_VIDEO: ${AGENT_EXECUTOR_ALLOW_VIDEO:-false}
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  XUNHU_APP_ID: ${XUNHU_APP_ID:-}
  XUNHU_APP_SECRET: ${XUNHU_APP_SECRET:-}
  XUNHU_BASE_URL: ${XUNHU_BASE_URL:-https://api.xunhupay.com}
  XUNHU_NOTIFY_URL: ${XUNHU_NOTIFY_URL:-}
  XUNHU_RETURN_URL: ${XUNHU_RETURN_URL:-}
  XUNHU_TIMEOUT_MS: ${XUNHU_TIMEOUT_MS:-10000}
  PAYMENT_RECONCILE_INTERVAL_MS: ${PAYMENT_RECONCILE_INTERVAL_MS:-60000}
  BILLING_EXPIRY_SWEEP_MS: ${BILLING_EXPIRY_SWEEP_MS:-300000}

services:
  tapflow-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - tapflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  tapflow-api:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:api"]
    depends_on:
      tapflow-redis:
        condition: service_healthy
    environment:
      <<: *tapflow-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3366}:3366"
    volumes:
      - ${PROMPT_CATALOG_MEDIA_HOST_DIR:-/opt/aittco/data/tapflow/prompt-catalog}:/var/lib/tapflow/prompt-catalog

  tapflow-worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    depends_on:
      tapflow-redis:
        condition: service_healthy
    environment:
      <<: *tapflow-env

  tapflow-migrator:
    profiles: ["tools"]
    build: .
    restart: "no"
    command: ["node", "packages/db/dist/cli.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-}

  tapflow-frontend:
    build:
      context: .
      args:
        VITE_AGENT_DIRECTOR_ENABLED: ${VITE_AGENT_DIRECTOR_ENABLED:-false}
        VITE_VIDEO_COMPOSER_V2: ${VITE_VIDEO_COMPOSER_V2:-true}
        VITE_LANDING_MEDIA_BASE_URL: ${VITE_LANDING_MEDIA_BASE_URL:-/landing-films/v1}
    restart: unless-stopped
    command: ["node", "scripts/serve-dist.cjs", "5188"]
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 5188
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://tapflow-api:3366}
      VITE_AGENT_DIRECTOR_ENABLED: ${VITE_AGENT_DIRECTOR_ENABLED:-false}
      VITE_VIDEO_COMPOSER_V2: ${VITE_VIDEO_COMPOSER_V2:-true}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5188}:5188"

volumes:
  tapflow-redis-data:
