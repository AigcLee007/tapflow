<svg width="1500" height="760" viewBox="0 0 1500 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080B"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E2026" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#15171C" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22252D"/>
      <stop offset="1" stop-color="#17191F"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8F8F"/>
      <stop offset="1" stop-color="#F35D5D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1500" height="760" fill="url(#bg)"/>
  <text x="60" y="78" fill="#F7FAFC" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Project Dialog Options</text>
  <text x="60" y="112" fill="rgba(255,255,255,0.56)" font-size="18" font-family="Inter, Arial, sans-serif">Three directions for destructive-confirmation UI that match the current dark workspace language.</text>

  <text x="120" y="176" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">A. Compact Glass Modal</text>
  <text x="550" y="176" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">B. Structured Warning Modal</text>
  <text x="1010" y="176" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">C. Canvas Action Sheet</text>

  <text x="120" y="204" fill="rgba(255,255,255,0.52)" font-size="15" font-family="Inter, Arial, sans-serif">Closest to the existing project style, easiest to land quickly.</text>
  <text x="550" y="204" fill="rgba(255,255,255,0.52)" font-size="15" font-family="Inter, Arial, sans-serif">Adds hierarchy and consequence clarity for destructive actions.</text>
  <text x="1010" y="204" fill="rgba(255,255,255,0.52)" font-size="15" font-family="Inter, Arial, sans-serif">Feels lighter and more native to the canvas flow surface.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="236" width="372" height="420" rx="28" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="116" y="306" width="308" height="226" rx="24" fill="url(#panel)" stroke="rgba(255,255,255,0.1)"/>
    <text x="146" y="352" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Delete project?</text>
    <text x="146" y="388" fill="rgba(255,255,255,0.6)" font-size="15" font-family="Inter, Arial, sans-serif">The canvas and generated outputs cannot be restored</text>
    <text x="146" y="410" fill="rgba(255,255,255,0.6)" font-size="15" font-family="Inter, Arial, sans-serif">after deletion.</text>
    <rect x="146" y="452" width="86" height="40" rx="20" fill="rgba(255,255,255,0.08)"/>
    <text x="173" y="477" fill="#E5E7EB" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Cancel</text>
    <rect x="246" y="452" width="130" height="40" rx="20" fill="url(#danger)"/>
    <text x="286" y="477" fill="#130A0A" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Delete</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="514" y="236" width="372" height="420" rx="28" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="546" y="292" width="308" height="252" rx="26" fill="url(#panelSoft)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="574" y="324" width="42" height="42" rx="21" fill="rgba(243,93,93,0.16)" stroke="rgba(255,143,143,0.3)"/>
    <text x="589" y="351" fill="#FFB4B4" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">!</text>
    <text x="632" y="343" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Delete project</text>
    <text x="632" y="367" fill="rgba(255,255,255,0.44)" font-size="13" font-family="Inter, Arial, sans-serif">Permanent operation</text>
    <rect x="574" y="392" width="252" height="58" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
    <text x="592" y="420" fill="#F7FAFC" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">Will remove</text>
    <text x="592" y="441" fill="rgba(255,255,255,0.56)" font-size="13" font-family="Inter, Arial, sans-serif">project, canvas, cloud draft, generated result links</text>
    <rect x="574" y="474" width="102" height="40" rx="20" fill="rgba(255,255,255,0.08)"/>
    <text x="606" y="499" fill="#E5E7EB" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Cancel</text>
    <rect x="690" y="474" width="136" height="40" rx="20" fill="url(#danger)"/>
    <text x="726" y="499" fill="#130A0A" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Confirm delete</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="944" y="236" width="372" height="420" rx="28" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="976" y="330" width="308" height="180" rx="24" fill="url(#panel)" stroke="rgba(255,255,255,0.1)"/>
    <text x="1004" y="372" fill="#F7FAFC" font-size="21" font-family="Inter, Arial, sans-serif" font-weight="700">Delete current project</text>
    <text x="1004" y="404" fill="rgba(255,255,255,0.58)" font-size="15" font-family="Inter, Arial, sans-serif">A lighter action sheet attached to the menu flow.</text>
    <rect x="1004" y="438" width="122" height="38" rx="19" fill="url(#danger)"/>
    <text x="1043" y="462" fill="#130A0A" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Delete</text>
    <rect x="1138" y="438" width="102" height="38" rx="19" fill="rgba(255,255,255,0.08)"/>
    <text x="1170" y="462" fill="#E5E7EB" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Cancel</text>
    <path d="M1128 302L1146 330H1110L1128 302Z" fill="url(#panel)" stroke="rgba(255,255,255,0.1)"/>
  </g>

  <text x="118" y="700" fill="rgba(255,255,255,0.72)" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Recommendation: A for fastest consistency, B for the best deletion UX, C for the most canvas-native feel.</text>
</svg>
