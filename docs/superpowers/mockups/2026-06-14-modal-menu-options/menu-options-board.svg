<svg width="1500" height="760" viewBox="0 0 1500 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1500" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06080B"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="menuPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E2026" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#15171C" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
  </defs>

  <rect width="1500" height="760" fill="url(#bg2)"/>
  <text x="60" y="78" fill="#F7FAFC" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Project Menu Options</text>
  <text x="60" y="112" fill="rgba(255,255,255,0.56)" font-size="18" font-family="Inter, Arial, sans-serif">Three cleaner directions to unify width, row rhythm, icon policy, and visual hierarchy.</text>

  <text x="104" y="176" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">A. All-icon Unified Menu</text>
  <text x="538" y="176" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">B. Minimal TapNow-style Menu</text>
  <text x="982" y="176" fill="#F7FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">C. Sectioned Utility Menu</text>

  <text x="104" y="204" fill="rgba(255,255,255,0.52)" font-size="15" font-family="Inter, Arial, sans-serif">Every row uses the same monochrome icon slot and 60px row rhythm.</text>
  <text x="538" y="204" fill="rgba(255,255,255,0.52)" font-size="15" font-family="Inter, Arial, sans-serif">Strips visual noise; only keeps arrow and destructive coloring.</text>
  <text x="982" y="204" fill="rgba(255,255,255,0.52)" font-size="15" font-family="Inter, Arial, sans-serif">Keeps structure explicit with small section captions.</text>

  <g filter="url(#shadow2)">
    <rect x="120" y="238" width="292" height="418" rx="28" fill="url(#menuPanel)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="136" y="254" width="260" height="64" rx="18" fill="rgba(255,255,255,0.08)"/>
    <rect x="154" y="270" width="28" height="28" rx="9" fill="rgba(255,255,255,0.08)"/>
    <text x="195" y="289" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Back to workspace</text>
    <text x="364" y="289" fill="#F7FAFC" font-size="18" font-family="Inter, Arial, sans-serif">›</text>
    <rect x="136" y="330" width="260" height="58" rx="14" fill="transparent"/>
    <rect x="154" y="345" width="28" height="28" rx="9" fill="rgba(255,255,255,0.06)"/>
    <text x="195" y="364" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Rename project</text>
    <rect x="136" y="392" width="260" height="58" rx="14" fill="transparent"/>
    <rect x="154" y="407" width="28" height="28" rx="9" fill="rgba(255,255,255,0.06)"/>
    <text x="195" y="426" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">New project</text>
    <line x1="136" y1="468" x2="396" y2="468" stroke="rgba(255,255,255,0.08)"/>
    <rect x="136" y="484" width="260" height="58" rx="14" fill="rgba(243,93,93,0.08)"/>
    <rect x="154" y="499" width="28" height="28" rx="9" fill="rgba(243,93,93,0.15)"/>
    <text x="195" y="518" fill="#FFC1C1" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Delete project</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="554" y="238" width="292" height="418" rx="28" fill="url(#menuPanel)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="570" y="254" width="260" height="68" rx="20" fill="rgba(255,255,255,0.09)"/>
    <text x="598" y="296" fill="#F7FAFC" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700">Back to workspace</text>
    <text x="798" y="296" fill="#F7FAFC" font-size="18" font-family="Inter, Arial, sans-serif">›</text>
    <line x1="570" y1="338" x2="830" y2="338" stroke="rgba(255,255,255,0.08)"/>
    <rect x="570" y="350" width="260" height="60" rx="0" fill="transparent"/>
    <text x="598" y="387" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Rename project</text>
    <rect x="570" y="410" width="260" height="60" rx="0" fill="transparent"/>
    <text x="598" y="447" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">New project</text>
    <line x1="570" y1="486" x2="830" y2="486" stroke="rgba(255,255,255,0.08)"/>
    <rect x="570" y="498" width="260" height="60" rx="0" fill="transparent"/>
    <text x="598" y="535" fill="#FFC1C1" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Delete project</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="988" y="238" width="292" height="418" rx="28" fill="url(#menuPanel)" stroke="rgba(255,255,255,0.1)"/>
    <text x="1012" y="274" fill="rgba(255,255,255,0.38)" font-size="11" font-family="Inter, Arial, sans-serif" font-weight="700">NAVIGATION</text>
    <rect x="1004" y="286" width="260" height="58" rx="16" fill="rgba(255,255,255,0.08)"/>
    <text x="1032" y="322" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Back to workspace</text>
    <text x="1232" y="322" fill="#F7FAFC" font-size="18" font-family="Inter, Arial, sans-serif">›</text>
    <text x="1012" y="374" fill="rgba(255,255,255,0.38)" font-size="11" font-family="Inter, Arial, sans-serif" font-weight="700">PROJECT</text>
    <rect x="1004" y="386" width="260" height="54" rx="14" fill="transparent"/>
    <text x="1032" y="420" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Rename project</text>
    <rect x="1004" y="442" width="260" height="54" rx="14" fill="transparent"/>
    <text x="1032" y="476" fill="#F7FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">New project</text>
    <text x="1012" y="528" fill="rgba(255,255,255,0.38)" font-size="11" font-family="Inter, Arial, sans-serif" font-weight="700">DANGER</text>
    <rect x="1004" y="540" width="260" height="56" rx="14" fill="rgba(243,93,93,0.08)"/>
    <text x="1032" y="575" fill="#FFC1C1" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Delete project</text>
  </g>

  <text x="102" y="700" fill="rgba(255,255,255,0.72)" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Recommendation: B is the safest visual cleanup. A is best if you want stronger product identity. C is best if we want menu systems to scale across more actions.</text>
</svg>
